[project]
name = "ward"
version = "0.1.0"
description = "Hospital Patient Vital Signs Monitoring — a Kappa architecture data platform (EC8203 mini project)"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "confluent-kafka[avro,schemaregistry]>=2.4",
    "fastavro>=1.9",
    "prometheus-client>=0.20",
    "typer>=0.12",
]

[project.optional-dependencies]
# Split per container so each image installs only what it runs.
producer = []
store    = ["cassandra-driver>=3.29"]
api      = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "cassandra-driver>=3.29",
    "prometheus-fastapi-instrumentator>=7.0",
]
spark    = ["pyspark==3.5.1"]
report   = ["jinja2>=3.1", "weasyprint>=60.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "freezegun>=1.5",
    "httpx>=0.27",
    "cassandra-driver>=3.29",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ward"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ward", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's `Depends()` in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers on purpose: the NEWS2 reference table IS the
# expected value, and naming each threshold would hide what is being checked.
"tests/**" = ["E501"]
"scripts/**" = ["E501"]

# ---------------------------------------------------------------------------
# mypy is strict only where correctness is load-bearing and the types are good.
# Spark's stubs are poor enough that strict mode there produces noise, not safety.

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ward.clinical.*", "ward.simclock", "ward.store.dao"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "confluent_kafka.*", "cassandra.*"]
ignore_errors = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: needs a Spark session (slow)",
    "integration: needs the docker stack running",
    "arch: architectural invariant — gated separately in CI",
]

[tool.coverage.report]
# The clinical rule must be near-exhaustively covered: it is the one file the
# whole architecture argument protects.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
