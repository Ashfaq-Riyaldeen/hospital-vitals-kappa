# Alert rules. Every metric named here is checked against what the code really emits
# by tests/unit/test_observability_rules.py - the first version of this file alerted
# on a metric that did not exist, so its most important rule could never fire.
#
# Time here is REAL time. At the 288x simulated clock, 1 real minute is 4.8 simulated
# hours, so "for: 1m" is already long in ward terms; it is kept short for that reason.

groups:
  - name: ward_clinical_safety
    rules:
      - alert: WardMonitoringSilent
        # `or vector(0)` matters: when the stream container is gone its series vanish
        # entirely, and a plain rate() == 0 would then match nothing and never fire.
        expr: (sum(rate(risk_scores_written_total{scorer_version="v1"}[1m])) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
          category: clinical_safety
        annotations:
          summary: "No risk scores written for 1 minute - the ward screen is blind"
          description: >-
            Absence of alerts must never be read as absence of risk. With no scores being
            written, a deteriorating patient would not show on the ward monitor.

      - alert: StreamQueryStalled
        expr: time() - max(stream_last_progress_timestamp_seconds{scorer_version="v1"}) > 60
        for: 30s
        labels:
          severity: critical
          category: clinical_safety
        annotations:
          summary: "The Spark streaming query has reported no progress for over a minute"
          description: "The process is up but its query is not running micro-batches."

  - name: ward_pipeline
    rules:
      - alert: NoVitalsIngested
        expr: (sum(rate(readings_produced_total{status="ok"}[1m])) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
          category: ingestion
        annotations:
          summary: "No bedside readings reached Kafka for 1 minute"
          description: "All 40 monitors appear disconnected, or Kafka is not accepting writes."

      - alert: HighDLQRate
        expr: sum(rate(readings_dlq_total[5m])) / sum(rate(readings_validated_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          category: data_quality
        annotations:
          summary: "More than 5 % of readings are being dead-lettered"
          description: "The injected fault rate is about 1.6 %. Much more means real probe or device trouble."

      - alert: EndToEndLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(stream_end_to_end_seconds_bucket{scorer_version="v1"}[2m]))) > 30
        for: 2m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "95 % of readings take more than 30 s to reach the ward screen"
          description: "The stream is falling behind the monitors."

      - alert: ScrapeTargetDown
        expr: up{job!="ward-stream-v2"} == 0
        for: 1m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Prometheus cannot reach {{ $labels.job }}"
          description: "A service is down or its metrics endpoint is not answering."

      - alert: StaleLabDataElevated
        expr: serving_stale_labs_patients{job="ward-api"} > 10
        for: 5m
        labels:
          severity: warning
          category: clinical_governance
        annotations:
          summary: "More than 10 patients are being scored without fresh lab results"
          description: "Lab ingestion may have stalled; composite risk is falling back to NEWS2 alone."
