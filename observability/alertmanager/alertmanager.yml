# Two receivers, because alerts about PATIENT SAFETY and alerts about the PIPELINE
# go to different people. WardMonitoringSilent is both: the pipeline is down, and
# that means the ward screen is blind, so it goes to the ward as well as to ops.
#
# No webhook is configured. In a hospital these receivers would page the nurse in
# charge and the on-call engineer; here the routing is shown in the Alertmanager UI.
# (The first version pointed both at an `alert-sink` service that does not exist, so
# every notification failed.)
global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "category"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  receiver: "pipeline-oncall"
  routes:
    # `continue: true` lets a safety alert go on to the next route as well. Without
    # the catch-all route below it matched nothing further and never reached the
    # on-call engineer (seen in the first outage test).
    - matchers: ['category="clinical_safety"']
      receiver: "ward-safety"
      continue: true
    - receiver: "pipeline-oncall"

receivers:
  - name: "pipeline-oncall"
  - name: "ward-safety"
